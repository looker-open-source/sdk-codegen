name: Hackathon CI
on:
  pull_request:
    paths:
      - package.json
      - packages/wholly-artifact/**
      - packages/hackathon/**
      - .github/workflows/hackathon-ci.yml
      - yarn.lock

  push:
    branches:
      - main
    paths:
      - package.json
      - packages/wholly-artifact/**
      - packages/hackathon/**
      - .github/workflows/hackathon-ci.yml
      - yarn.lock

  workflow_dispatch:

permissions:
  checks: write

env:
  TS_JUNIT_OUTPUT_DIR: results/hackathon

jobs:
  unit:
    name: Unit - ${{ matrix.os }} / Node ${{ matrix.node-version }}
    env:
      JEST_JUNIT_OUTPUT_DIR: results/hackathon
      JEST_JUNIT_OUTPUT_NAME: ${{ matrix.os }}.apix${{ matrix.node-version }}.xml
    runs-on: ${{ matrix.os }}-latest

    strategy:
      matrix:
        os:
          - ubuntu
        node-version: [22.x]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@85880fa0301c86cca9da44039ee3bb12d3bedbfa # 0.12.1
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repo Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Node ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          yarn

      - name: Lint
        run: |
          yarn lint:es --quiet
          yarn lint:ts

      - name: Build all
        run: |
          yarn build
          yarn dedupe:ci

      - name: Bundle hackathon
        run: |
          yarn bundle
        working-directory: packages/hackathon
