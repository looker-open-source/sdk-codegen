name: Hackathon CI
on:
  pull_request:
    paths:
      - package.json
      - packages/wholly-artifact/**
      - packages/hackathon/**
      - .github/workflows/hackathon-ci.yml
      - yarn.lock

  push:
    branches:
      - main
    paths:
      - package.json
      - packages/wholly-artifact/**
      - packages/hackathon/**
      - .github/workflows/hackathon-ci.yml
      - yarn.lock

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write

env:
  TS_JUNIT_OUTPUT_DIR: results/hackathon

jobs:
  unit:
    name: Unit - ${{ matrix.os }} / Node ${{ matrix.node-version }}
    env:
      JEST_JUNIT_OUTPUT_DIR: results/hackathon
      JEST_JUNIT_OUTPUT_NAME: ${{ matrix.os }}.apix${{ matrix.node-version }}.xml
    runs-on: ${{ matrix.os }}-latest

    strategy:
      matrix:
        os:
          - ubuntu
        node-version: [24.x]

    steps:
      - name: Repo Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          yarn

      - name: Lint
        run: |
          yarn lint:es --quiet
          yarn lint:ts

      - name: Build all
        run: |
          yarn build
          yarn dedupe:ci

      - name: Bundle hackathon
        run: |
          yarn bundle
        working-directory: packages/hackathon
